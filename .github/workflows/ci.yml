name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node -c server.js

      - name: Check inline browser scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.trim());

          scripts.forEach((script, index) => {
            try {
              new Function(script);
            } catch (error) {
              console.error(`script ${index + 1} failed`);
              console.error(error.stack);
              process.exitCode = 1;
            }
          });

          if (!process.exitCode) console.log('index scripts ok');
          NODE
